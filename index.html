<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quán xôi">
<title>Giá vốn &amp; kho quán xôi</title>
<style>
:root{--bg:#faf6ee;--fg:#2b2418;--card:#fff;--mut:#8a7f6c;--ac:#c2410c;--ln:#e8dfcc;--ok:#15803d;--bad:#b91c1c;--warn:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130d;--fg:#f3ebdb;--card:#241e14;--mut:#a09580;--ac:#fb923c;--ln:#3a3122;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24}}
:root[data-theme="dark"]{--bg:#17130d;--fg:#f3ebdb;--card:#241e14;--mut:#a09580;--ac:#fb923c;--ln:#3a3122;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px -apple-system,system-ui,"Segoe UI",sans-serif}
main{padding:14px 14px 110px;max-width:640px;margin:0 auto}
h1{font-size:23px;margin:6px 0 12px}
button,input,select{font:inherit;color:var(--fg)}
button{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 14px}
button.pri{background:var(--ac);color:#fff;border:0;font-weight:600;width:100%;padding:14px}
button.sm{padding:6px 12px;border-radius:8px}
input,select{width:100%;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:9px;margin-top:4px}
.box{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:4px 12px}
.row{display:flex;align-items:center;gap:8px}.row>div{flex:1;min-width:0}.row>input{width:84px;margin:0;text-align:right}
.ing{padding:11px 0;border-bottom:1px solid var(--ln)}.ing:last-child{border:0}
small,.mut{color:var(--mut)}small{display:block;margin-top:2px}
.low{color:var(--bad);font-weight:600}.warn{color:var(--warn);font-weight:600}.ok{color:var(--ok);font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.stat{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px}.stat b{font-size:18px}
.pn{margin-top:10px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:8px 0}
label{display:block;font-size:12px;color:var(--mut);margin-top:6px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:4px}.chips button{white-space:nowrap}.chips .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tier{background:var(--card);border:1px solid var(--ln);border-radius:12px;margin:14px 0;overflow:hidden}.in{padding:0 12px 12px}
.th{background:#111;color:#fff;text-align:center;padding:9px;font-weight:600;font-size:14px}
.rw{padding:10px 0;border-bottom:1px solid var(--ln)}.rt{display:flex;justify-content:space-between;gap:8px}
.tot{display:flex;justify-content:space-between;background:#70ad47;color:#fff;padding:10px 12px;border-radius:8px;margin:10px 0 6px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{position:relative;text-align:left;display:flex;flex-direction:column;gap:2px;padding:16px 14px}.card span{color:var(--ac);font-weight:600}.bd{position:absolute;top:8px;right:8px;background:var(--ac);color:#fff;border-radius:99px;min-width:26px;text-align:center;font-style:normal;font-size:14px;padding:2px 7px}
details{border-bottom:1px solid var(--ln);padding:9px 0}summary{font-weight:600;cursor:pointer}details ol,details p{font-size:14px;line-height:1.55;margin:8px 0 4px;padding-left:20px}details p{padding-left:0}
.sq{aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:space-between;gap:6px;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:10px;min-width:0}.sq .chips{margin:0;justify-content:center;flex-wrap:wrap;overflow:visible}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sq3{padding:6px;gap:4px}.sq3 .mb{padding:6px 0;border-radius:8px;font-size:12px;flex:1;min-width:0;line-height:1.1}.sq3 .mb.pri{width:auto;margin:0;padding:6px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:10px 1px;font-size:11px;color:var(--mut)}nav button.on{color:var(--ac);font-weight:700}
#t{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#222;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;max-width:90%;text-align:center}#t.on{opacity:1}
</style>
</head>
<body>
<main id="main"></main>
<datalist id="ul"><option>kg</option><option>g</option><option>lít</option><option>ml</option><option>cái</option><option>quả</option><option>hộp</option><option>gói</option><option>chai</option><option>bó</option><option>túi</option><option>lon</option><option>ly</option><option>thùng</option><option>lốc</option><option>bịch</option><option>khay</option><option>vỉ</option></datalist>
<nav>
<button data-t="sell" onclick="go('sell')">🛒<br>Bán hàng</button>
<button data-t="cost" onclick="go('cost')">🍱<br>Giá vốn</button>
<button data-t="stock" onclick="go('stock')">📦<br>Tồn kho<span id="lb"></span></button>
<button data-t="stat" onclick="go('stat')">📊<br>Thống kê</button>
<button data-t="close" onclick="go('close')">📋<br>Chốt ngày</button>
<button data-t="more" onclick="go('more')">⚙️<br>Thêm</button>
</nav>
<div id="t"></div>
<script>
const $=s=>document.querySelector(s),K='xoi-kho-v1';
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
const uid=()=>'i'+Math.random().toString(36).slice(2,8);
function dk(t){const x=new Date(t);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function seed(){const I=(n,u,p,s,low)=>({id:uid(),n,u,p,s,low});return{ing:[I('Gạo làm xôi vàng','kg',20000,0,8),I('Bột nghệ','kg',150000,0,.2),I('Dầu hành','lít',60000,0,.5),I('Thịt','kg',110000,0,3),I('Đường','kg',25000,0,1),I('Hành khô','kg',40000,0,.5),I('Ớt','kg',0,0,.2),I('Hạt nêm','kg',36000,0,.3),I('Bột ngọt','kg',55000,0,.2),I('Nước mắm','lít',11000,0,.5),I('Màu trung thành','lít',83000,0,.2),I('Hộp','hộp',225,0,100),I('Thìa','cái',100,0,100),I('Túi nilon','cái',25,0,100),I('Trứng vịt','quả',2000,0,20)]}}
if(!S||!S.ing)S=seed();
if(!S.v){const t=S.ing.find(x=>x.n==='Túi nilon'&&x.p===350);if(t)t.p=25;delete S.dishes;delete S.pf;S.v=2}
if(!S.menu)S.menu=mseed();if(!S.tg)S.tg=40;if(S.er==null)S.er=10;if(!S.sales)S.sales=[];if(!S.adj)S.adj=[];
if(S.v<3)S.v=3;
mig();
if(S.v<4){addExtras();S.v=4}
if(S.v<5){wipe();S.v=5}
function mseed(){
  const by=n=>(S.ing.find(x=>x.n===n)||{}).id,R=o=>({id:uid(),...o}),LN=a=>a.map(([n,q])=>[by(n),q]).filter(l=>l[0]);
  const gv=LN([['Hành khô',40],['Ớt',40],['Đường',50],['Hạt nêm',46],['Bột ngọt',20],['Nước mắm',40],['Màu trung thành',15]]);
  const T=(p,g,gy,t)=>{const th=R({t:'m',n:'Thịt ba chỉ',ing:by('Thịt'),qty:t,y:.6875,add:0,note:'Thịt chín - đã ngót'});return{id:uid(),price:p,rows:[R({t:'m',n:'Xôi vàng (Nền)',ing:by('Gạo làm xôi vàng'),qty:g,y:gy,add:10,note:'Xôi chín'}),th,R({t:'a',n:'Gia vị kho',of:th.id,lines:gv,note:'Nước sốt rưới + gia vị ngấm'}),R({t:'m',n:'Trứng vịt',ing:by('Trứng vịt'),qty:.5,y:1,add:0,note:'Cắt đôi'}),R({t:'s',n:'Bao bì',lines:LN([['Hộp',1],['Thìa',1],['Túi nilon',1]]),note:''})]}};
  return[{id:'d1',n:'Xôi thịt kho',tiers:[T(25000,155,155/110,40),T(30000,190,1.6,50)]}]}

/* --- KẾT NỐI API GOOGLE SHEETS VÀ FETCH API --- */
const API_URL = 'https://script.google.com/macros/s/AKfycbyV0ts9bTPoCJnzcYh5UM2XukZ49nF4CWDAa9Y_UWHSR1rjo7mtYwYbGd_DgQ-HawX3/exec'; // Hãy điền link Google Apps Script vào đây

let GST='',gT=null,gBusy=false,gDirty=false;
const gtxt=()=>'☁ '+(GST||'sẵn sàng');
function gst(t){GST=t;['#gs','#gs2'].forEach(q=>{const e=$(q);if(e)e.textContent=gtxt()})}
const save=()=>{S.ts=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){} qsync()};
function qsync(){gDirty=true;clearTimeout(gT);gT=setTimeout(gpush,1500)}
function gpush(){
  if(gBusy){gDirty=true;return}
  gBusy=true;gDirty=false;gst('đang gửi...');
  if(API_URL === 'ĐIỀN_LINK_CỦA_BẠN_VÀO_ĐÂY') {
      gBusy=false; gst('chưa gắn link Sheets'); return;
  }
  fetch(API_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain'}, // Dùng text/plain để tránh lỗi chặn CORS
    body: JSON.stringify({state: JSON.stringify(S), tables: JSON.stringify(buildTables())})
  }).then(r=>r.json()).then(res=>{
    gBusy=false;gst('đã đồng bộ '+new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}));
    if(gDirty)gpush();
  }).catch(e=>{
    gBusy=false;gst('lỗi gửi, sẽ thử lại');
    clearTimeout(gT);gT=setTimeout(gpush,15000);
  });
}
function gpull(){ gst('sẵn sàng'); }

const sum=a=>a.reduce((x,y)=>x+y,0),d=(n,m=2)=>(+n).toLocaleString('vi-VN',{maximumFractionDigits:m}),money=n=>d(n,0)+'đ',pr=x=>x<100?d(x,2):d(x,0),pk=p=>d(p/1000,1)+'k';
const esc=s=>String(s??'').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const ing=id=>S.ing.find(x=>x.id===id),st=i=>i.s<=0?2:i.s<=i.low?1:0;
const fac=u=>({kg:1000,'lít':1000})[u]||1,bu=u=>u==='kg'?'g':u==='lít'?'ml':u,bp=g=>pAt(g)/fac(g.u);

let tab='sell',OP=null,armed='',OD='d1',EM=false,ALT=null,GIFT=false,RF=null,RT=null,DINE=0,SEL={},SF=null,ST=null,FXM=null,CM=null,CSRC='app',PJ=null;

/* --- BIẾN TRẠNG THÁI LỌC LỊCH SỬ KHOẢNG NGÀY --- */
let HSF = dk(Date.now()), HST = dk(Date.now()), SHOW_HISTORY = false;

function toast(m){const t=$('#t');t.textContent=m;t.classList.add('on');clearTimeout(window._t);window._t=setTimeout(()=>t.classList.remove('on'),2200)}
const go=t=>{tab=t;render()},ch=()=>{save();render()},oh=id=>{OP=OP===id?null:id;render()};
function render(){
  const html=({sell:vSell,cost:vCost,stock:vStock,low:vLow,close:vClose,more:vMore,stat:vStat})[tab]();$('#main').innerHTML=html.replace('</h1>','</h1>'+(tab==='stat'||tab==='more'?'':dbar()));
  const n=S.ing.filter(st).length;$('#lb').textContent=n?' ('+n+')':'';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===(tab==='low'?'stock':tab)));
}
/* ===== LỊCH SỬ NGÀY ===== */
let VD=null;
const vd=s=>s.split('-').reverse().join('/');
const vdate=()=>VD||dk(Date.now()),isT=()=>!VD||VD===dk(Date.now());
function sv(v){VD=v&&v!==dk(Date.now())?v:null;if(VD){EM=false;OP=null} SHOW_HISTORY=false; render()}

/* Hàm đổi khoảng thời gian lọc lịch sử */
function setHistRange(f, t) {
    if(f) HSF = f;
    if(t) HST = t;
    SHOW_HISTORY = true;
    VD = null;
    EM = false; OP = null;
    render();
}

function wipe(){try{localStorage.setItem(K+'-backup-'+dk(Date.now()),JSON.stringify(S))}catch(e){}
  S.ing.forEach(i=>i.s=0);S.sales=[];S.adj=[];S.buys=[];S.close={};S.log=[];S.logFrom=dk(Date.now());S.setup=false}
function wipeBtn(){if(armed!=='wp'){armed='wp';return toast('Bấm lần nữa để xoá. Một bản dự phòng được giữ trong máy')}wipe();ALT=null;GIFT=false;DINE=0;VD=null;armed='';ch();toast('Đã đưa tồn kho và lịch sử bán về 0')}
function mig(){if(!S.fx)S.fx={};if(!S.close)S.close={};if(!S.buys)S.buys=[];S.ing.forEach(i=>{if(!i.h)i.h=[[dk(Date.now()),i.p]]});
  if(!S.log){S.log=S.sales.flatMap(s=>Object.keys(s.use||{}).map(i=>({t:s.t,i,k:'sell',d:-s.use[i]}))).concat(S.adj.map(a=>({t:a.t,i:a.i,k:'adj',d:a.d})));S.logFrom=dk(Math.min(Date.now(),...S.log.map(l=>l.t)))}}
function pAt(g){if(isT()||!g.h||!g.h.length)return g.p;let v=g.h[0][1];for(const [dt,p] of g.h)if(dt<=VD)v=p;return v}
function setP(g,p,dt){dt=dt||dk(Date.now());g.h=g.h||[];const e=g.h.find(x=>x[0]===dt);if(e)e[1]=p;else g.h.push([dt,p]);g.h.sort((a,b)=>a[0]<b[0]?-1:1);g.p=g.h[g.h.length-1][1]}
const stAt=(g,ds)=>+(g.s-sum(S.log.filter(l=>l.i===g.id&&dk(l.t)>ds).map(l=>l.d))).toFixed(4);
const gsBadge=()=>`<span id="gs" class="mut" style="font-size:11px;margin-left:auto;white-space:nowrap">${gtxt()}</span>`;

/* Hàm thanh điều hướng ngày */
function dbar(){
  const d0=vdate(),T=dk(Date.now()),Y=dk(Date.now()-864e5);
  let barHTML = '';
  if (tab === 'sell') {
      if (SHOW_HISTORY) {
          barHTML = `<div class="chips" style="margin:0 0 10px;align-items:center"><button onclick="sv('${T}')">Quay lại Hôm nay</button><span class="mut" style="font-size:12px;margin:0 6px">Từ:</span><input type="date" value="${HSF}" max="${T}" style="width:130px;margin:0" onchange="setHistRange(this.value, null)"><span class="mut" style="font-size:12px;margin:0 6px">Đến:</span><input type="date" value="${HST}" max="${T}" style="width:130px;margin:0" onchange="setHistRange(null, this.value)">${gsBadge()}</div>`;
      } else {
         barHTML = `<div class="chips" style="margin:0 0 10px;align-items:center"><button class="${d0===T?'on':''}" onclick="sv('${T}')">Hôm nay</button><button class="${d0===Y?'on':''}" onclick="sv('${Y}')">Hôm qua</button><input type="date" value="${d0}" max="${T}" style="width:150px;margin:0" onchange="sv(this.value)"><button onclick="setHistRange('${T}', '${T}')">Lịch sử từ ngày...</button>${gsBadge()}</div>`;
      }
  } else {
      barHTML = `<div class="chips" style="margin:0 0 10px;align-items:center"><button class="${d0===T?'on':''}" onclick="sv('${T}')">Hôm nay</button><button class="${d0===Y?'on':''}" onclick="sv('${Y}')">Hôm qua</button><input type="date" value="${d0}" max="${T}" style="width:150px;margin:0" onchange="sv(this.value)">${gsBadge()}</div>`;
  }
  
  if (tab === 'sell' && SHOW_HISTORY) {
      return barHTML + `<div class="box" style="margin-bottom:10px"><span class="warn">Đang xem lịch sử bán hàng từ ngày ${vd(HSF)} đến ${vd(HST)} (chỉ xem thống kê)</span></div>`;
  } else {
      return barHTML + (d0!==T?`<div class="box" style="margin-bottom:10px"><span class="warn">Đang xem lịch sử ngày ${vd(d0)} (chỉ xem)</span> · <a onclick="sv('${T}')" style="color:var(--ac)">về hôm nay</a></div>`:'');
  }
}

/* ===== GIÁ THEO NGÀY, NHẬT KÝ, CHỐT NGÀY, SAO LƯU ===== */
function hedit(i){const id=i.id;return `<small style="margin-top:10px">Lịch sử giá (đ/${esc(i.u)}). Mỗi mức giá có hiệu lực từ ngày đó đến khi có mức giá mới.</small>${(i.h||[]).map(([dt,p],k)=>`<div class="row" style="margin-top:6px"><input type="date" value="${dt}" style="width:140px;margin:0;text-align:left" onchange="eh('${id}',${k},0,this.value)"><input type="number" inputmode="decimal" value="${p}" style="flex:1;width:auto;margin:0" onchange="eh('${id}',${k},1,this.value)"><button class="sm" onclick="dh('${id}',${k})">✕</button></div>`).join('')}<div class="row" style="margin-top:6px"><input id="hd_${id}" type="date" value="${dk(Date.now())}" style="width:140px;margin:0;text-align:left"><input id="hp_${id}" type="number" inputmode="decimal" placeholder="Giá mới" style="flex:1;width:auto;margin:0"><button class="sm" onclick="ah('${id}')">Thêm</button></div>`}
function eh(id,k,f,v){const g=ing(id);g.h[k][f]=f?(+v||0):(v||dk(Date.now()));g.h.sort((a,b)=>a[0]<b[0]?-1:1);g.p=g.h[g.h.length-1][1];ch()}
function dh(id,k){const g=ing(id);if(g.h.length<2)return toast('Cần giữ ít nhất 1 mức giá');g.h.splice(k,1);g.p=g.h[g.h.length-1][1];ch()}
function ah(id){const v=$('#hp_'+id).value;if(v==='')return toast('Nhập giá mới');setP(ing(id),+v,$('#hd_'+id).value||dk(Date.now()));ch()}
function delBuy(id){const b=S.buys.find(x=>x.id===id);if(!b)return;if(armed!==id){armed=id;return toast('Bấm lần nữa để xoá lần nhập này (kho bị trừ lại)')}const g=ing(b.i);if(g)g.s=+(g.s-b.q).toFixed(4);S.buys=S.buys.filter(x=>x.id!==id);S.log=S.log.filter(l=>l.b!==id);armed='';ch()}
function sc(ds,f,v){S.close[ds]=S.close[ds]||{cash:'',bank:''};S.close[ds][f]=v;ch()}
function gl(D,T){const r=T.rows.find(x=>x.t==='m'),g=r&&ing(r.ing),pc=gfv(D);return g&&bu(g.u)==='g'?d(r.qty*pc/100,1)+' g':pc+'%'}
function setGg(v){const D=S.menu.find(x=>x.id===OD),r=D.tiers[0].rows.find(x=>x.t==='m');if(!r||!(+v>0)||!(r.qty>0))return toast('Món này cần có một dòng nguyên liệu có định lượng');if(+v>=r.qty)toast('Lớn hơn hoặc bằng 1 phần ăn thêm, đặt tối đa 100%');D.gf=Math.min(100,+(v/r.qty*100).toFixed(2));ch()}
function cyc(did){const D=S.menu.find(x=>x.id===did),i=D.tiers.findIndex(t=>t.id===(SEL[did]||D.tiers[0].id));SEL[did]=D.tiers[(i+1)%D.tiers.length].id;render()}
const gfv=D=>D.gf!=null?D.gf:(D.kind==='resale'?100:50);
function setGf(v){S.menu.find(x=>x.id===OD).gf=Math.max(0,Math.min(100,+v||0));ch()}
function setKind(v){S.menu.find(x=>x.id===OD).kind=v;ch()}
function vClose(){
  const ds=vdate(),T0=isT(),ts=S.sales.filter(s=>dk(s.t)===ds),rev=sum(ts.map(s=>s.p)),cl=S.close[ds]||{cash:'',bank:''},has=cl.cash!==''||cl.bank!=='',real=(+cl.cash||0)+(+cl.bank||0),df=real-rev;
  const adjs=S.adj.filter(a=>dk(a.t)===ds&&ing(a.i)),bs=S.buys.filter(b=>dk(b.t)===ds);
  const a0=RF||dk(Date.now()-6*864e5),b0=RT||dk(Date.now()),inR=t=>{const x=dk(t);return x>=a0&&x<=b0},rs=S.sales.filter(s=>inR(s.t)),rrev=sum(rs.map(s=>s.p)),rc=sum(rs.map(s=>s.c)),gift=sum(rs.filter(s=>s.free).map(s=>s.c)),rb=sum(S.buys.filter(x=>inR(x.t)).map(x=>x.c));

function sens(T,tot,lai){const e=S.er||0;if(!e)return '';const v=sum(T.rows.filter(isVar).map(r=>rcost(r,T))),dl=v*e/100;

function addTier(did){const D=S.menu.find(x=>x.id===did),b=D.tiers.find(t=>t.id===$('#tb_'+did).value)||D.tiers[D.tiers.length-1],price=+$('#tp_'+did).value||0,pc=+$('#tq_'+did).value||0;if(!price)return toast('Nhập giá bán mới');

function usage(T,nopack){const m={},add=(id,b)=>{const g=ing(id);if(g)m[id]=(m[id]||0)+b/fac(g.u)};
  T.rows.forEach(r=>{if(nopack&&r.t==='s')return;if(r.t==='m')add(r.ing,rawOf(r));else if(r.t==='a'){const b=T.rows.find(x=>x.id===r.of),raw=b?rawOf(b):0;r.lines.forEach(([i,q])=>add(i,q*raw/1000))}else if(r.t==='c'){const f=r.out?r.qty/r.out:0;r.lines.forEach(([i,q])=>add(i,q*f))}else r.lines.forEach(([i,q])=>add(i,q))});return m}
function canT(T,np){const u=usage(T,np);let best=Infinity,lim=null;for(const i in u){const g=ing(i);if(!g||u[i]<=0)continue;const n=Math.max(0,Math.floor(g.s/u[i]+1e-9));if(n<best){best=n;lim=g}}return{n:best===Infinity?null:best,lim}}
